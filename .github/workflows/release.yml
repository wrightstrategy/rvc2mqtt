name: Cut release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview version, deployment notes, and existing image digest
        type: boolean
        default: true
      bump:
        description: Version increment
        type: choice
        options: [auto, minor, major]
        default: auto

permissions:
  contents: read

# One registry/release target; retain requests and reject stale selected commits.
concurrency:
  group: rvc2mqtt-stable-release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # Public repositories cannot use the organization's private runner pool.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.11'
          enable-cache: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Mint repository-scoped release token
        if: ${{ !inputs.dry_run }}
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23li0miDaDkDM94E0Q
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: read
      - name: Preview or cut release without rebuilding
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          git switch -C main "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 ci/release.py
