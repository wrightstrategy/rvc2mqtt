name: Cut release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview version, deployment notes, and existing image digest
        type: boolean
        default: true
      bump:
        description: Version increment
        type: choice
        options: [auto, minor, major]
        default: auto

permissions:
  contents: read

# One registry/release target; retain requests and reject stale selected commits.
concurrency:
  group: rvc2mqtt-stable-release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # Public repositories cannot use the organization's private runner pool.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Mint repository-scoped release token
        if: ${{ !inputs.dry_run }}
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23li0miDaDkDM94E0Q
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: read
      - name: Preview or cut release without rebuilding
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          git switch -C main "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 ci/release.py
