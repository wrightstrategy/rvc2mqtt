name: Image CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: image-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/image-check.yml
    with:
      publish: false
    permissions:
      contents: read

  branch:
    if: github.event_name == 'push'
    uses: ./.github/workflows/image-check.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write
